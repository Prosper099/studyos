<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StudyOS Brain Check — 10 quick questions, 10 minutes</title>
<meta name="description" content="The StudyOS Brain Check: 10 quick friendly questions, 10 minutes, instant score and subject breakdown. No sign-up needed." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="StudyOS" />
<meta property="og:title" content="StudyOS Brain Check — 10 quick questions, 10 minutes" />
<meta property="og:description" content="10 quick questions, 10 minutes, instant score with confetti if you smash it. No sign-up. 100% free. Beat your friends." />
<meta property="og:url" content="https://studyos-academic.vercel.app/preview.html" />
<meta property="og:image" content="https://studyos-academic.vercel.app/og.png" />
<style>
  :root { --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --ind:#4f46e5; --grn:#10b981; --amb:#f59e0b; --rose:#f43f5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:#f1f5f9; color:var(--ink); min-height:100vh; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 14px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 24px -18px rgba(15,23,42,.35); padding:20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:14px; padding:14px 22px; font-weight:800; font-size:14px; cursor:pointer; text-decoration:none; transition:.15s; }
  .btn-p { background:var(--ind); color:#fff; } .btn-p:hover { background:#4338ca; }
  .btn-d { background:var(--ink); color:#fff; } .btn-d:hover { background:#1e293b; }
  .btn-wa { background:#25D366; color:#fff; } .btn-wa:hover { background:#1ebe5b; }
  .btn-g { background:#fff; color:#334155; border:1px solid var(--line); } .btn-g:hover { background:#f8fafc; }
  .brand { display:flex; align-items:center; gap:10px; margin:6px 0 18px; }
  .logo { width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,#4f46e5,#0ea5e9); display:flex; align-items:center; justify-content:center; color:#fff; font-size:19px; }
  .brand b { font-size:17px; } .brand span { display:block; font-size:10px; color:var(--mut); font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .hero { background:linear-gradient(135deg,#0f172a,#312e81 60%,#0f172a); color:#fff; border-radius:20px; padding:26px 22px; margin-bottom:14px; }
  .hero h1 { font-size:23px; line-height:1.25; } .hero p { margin-top:10px; font-size:13px; color:#cbd5e1; line-height:1.55; }
  .pill { display:inline-block; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#e0e7ff; border-radius:999px; padding:5px 12px; font-size:11px; font-weight:800; letter-spacing:.06em; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  .stat { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:10px 6px; text-align:center; }
  .stat b { display:block; font-size:17px; } .stat span { font-size:10px; color:#94a3b8; font-weight:700; }
  ul.why { list-style:none; margin-top:6px; } ul.why li { font-size:13px; color:#334155; padding:7px 0 7px 26px; position:relative; }
  ul.why li::before { content:'✓'; position:absolute; left:4px; color:var(--grn); font-weight:900; }
  .foot { text-align:center; font-size:11px; color:var(--mut); margin-top:18px; line-height:1.6; }
  .foot a { color:var(--ind); font-weight:700; text-decoration:none; }
  /* exam */
  .hall { background:var(--ink); color:#fff; border-radius:16px; padding:14px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; }
  .hall .t { font-weight:900; letter-spacing:.14em; font-size:13px; }
  .hall .q { font-size:12px; color:#cbd5e1; font-weight:700; }
  .timer { margin-left:auto; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:6px 12px; font-family:ui-monospace,monospace; font-size:13px; font-weight:800; }
  .timer.warn { background:#78350f; border-color:#b45309; color:#fde68a; }
  .timer.crit { background:#881337; border-color:#e11d48; color:#ffe4e6; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  .subj-tag { display:inline-block; background:#eef2ff; color:var(--ind); border-radius:6px; padding:2px 8px; font-size:10px; font-weight:800; margin-left:8px; vertical-align:middle; }
  .qtitle { font-size:15px; font-weight:700; line-height:1.5; margin:10px 0 14px; }
  .opt { display:flex; width:100%; gap:10px; align-items:center; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:13px; padding:12px 14px; font-size:13.5px; font-weight:600; color:#334155; cursor:pointer; margin-bottom:9px; transition:.12s; font-family:inherit; }
  .opt:hover { border-color:#a5b4fc; background:#eef2ff66; }
  .opt.on { border-color:#818cf8; background:#eef2ff; box-shadow:0 0 0 1px #818cf8 inset; }
  .opt .L { flex:none; width:26px; height:26px; border-radius:8px; background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; }
  .opt.on .L { background:var(--ind); color:#fff; }
  .row { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:14px; flex-wrap:wrap; }
  .nav-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .dot { width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:800; color:#475569; cursor:pointer; }
  .dot.cur { background:var(--ink); color:#fff; box-shadow:0 0 0 2px #a5b4fc; }
  .dot.ans { background:var(--ind); border-color:var(--ind); color:#fff; }
  .banner { background:#fff1f2; border:1px solid #fecdd3; color:#9f1239; border-radius:16px; padding:14px; text-align:center; font-weight:800; font-size:14px; margin-bottom:12px; }
  /* results */
  .big { font-size:44px; font-weight:900; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; text-align:center; }
  .kpi b { display:block; font-size:16px; } .kpi span { font-size:10px; color:var(--mut); font-weight:700; }
  .bar { height:7px; background:#f1f5f9; border-radius:99px; overflow:hidden; } .bar i { display:block; height:100%; border-radius:99px; }
  .srow { margin-bottom:10px; } .srow .lbl { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:4px; }
  .lockwrap { position:relative; border-radius:16px; overflow:hidden; }
  .locked { filter:blur(7px); user-select:none; pointer-events:none; }
  .lockveil { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(255,255,255,.55); text-align:center; padding:18px; }
  .exp { border:1px solid var(--line); border-radius:13px; padding:12px 14px; margin-bottom:9px; background:#fff; }
  .exp .qq { font-size:12.5px; font-weight:700; } .exp .aa { font-size:12px; color:#047857; font-weight:700; margin-top:4px; } .exp .ee { font-size:11.5px; color:#475569; margin-top:5px; line-height:1.5; }
  .hidden { display:none !important; }
  @keyframes pBurst { 0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(680deg) scale(.85); opacity: 0; } }
  .pconfetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
  .pconfetti i { position: absolute; left: 50%; top: 50%; width: 6px; height: 10px; border-radius: 2px; animation: pBurst 1.5s cubic-bezier(.1, .65, .35, 1) forwards; }
  .share-tip { font-size:11px; color:var(--mut); margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var QS = __QUESTIONS__;
var PICK = 10, MINUTES = 10;
var paper = [], answers = {}, idx = 0, deadline = 0, tick = null, done = false, timeUp = false, startedAt = 0;

function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function fmt(ms) { var t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function $(id) { return document.getElementById(id); }

function landing() {
  $('app').innerHTML =
    '<div class="brand"><div class="logo">📚</div><div><b>StudyOS</b><span>Nigeria&apos;s study companion</span></div></div>' +
    '<div class="hero">' +
      '<span class="pill">🧠 FREE BRAIN CHECK</span>' +
      '<h1 style="margin-top:12px">How sharp is your brain today?</h1>' +
      '<p>10 quick, friendly questions across six subjects. 10 easy minutes. Instant score with a subject-by-subject breakdown — no sign-up, no stress.</p>' +
      '<div class="stats">' +
        '<div class="stat"><b>10</b><span>easy questions</span></div>' +
        '<div class="stat"><b>10:00</b><span>timer</span></div>' +
        '<div class="stat"><b>₦0</b><span>forever</span></div>' +
      '</div>' +
      '<button class="btn btn-p" style="width:100%" onclick="startExam()">⚡ Start the check — it&apos;s free</button>' +
    '</div>' +
    '<div class="card">' +
      '<b style="font-size:14px">🚧 StudyOS is a preview project — help us spread the word</b>' +
      '<p style="margin:8px 0 8px;font-size:13px;line-height:1.5">We are still building, and everything is 100% free while we do. The full app already packs 83 topics, 1,000+ exam-style questions, 1,200+ flashcards and a real CBT exam hall — but shares from people like you are how it reaches every school in Nigeria.</p>' +
      '<ul class="why">' +
        '<li>Take the Brain Check and flex your score 😌</li>' +
        '<li>Forward the link to your class group, your rivals, your aunties</li>' +
        '<li>Open the full app free and tell us what to build next</li>' +
      '</ul>' +
      '<a class="btn btn-d" style="width:100%;margin-top:10px" href="/">Open the full StudyOS app →</a>' +
    '</div>' +
    '<p class="foot">Made with 💜 for Nigerian students · <a href="/">studyos.app</a><br>Share this check with your class group — wisdom multiplies when shared.</p>';
}

function startExam() {
  paper = shuffle(QS.slice()).slice(0, PICK).map(function (q) {
    var idx = [0, 1, 2, 3];
    shuffle(idx);
    return { s: q.s, q: q.q, e: q.e, o: idx.map(function (i) { return q.o[i]; }), c: idx.indexOf(q.c) };
  });
  answers = {}; idx = 0; done = false; timeUp = false;
  startedAt = Date.now();
  deadline = Date.now() + MINUTES * 60000;
  clearInterval(tick); tick = setInterval(beat, 1000);
  render();
}

function beat() {
  var el = $('tm'); if (!el) return;
  var left = deadline - Date.now();
  el.textContent = '⏱ ' + fmt(left);
  el.className = 'timer' + (left <= 60000 ? ' crit' : left <= 300000 ? ' warn' : '');
  if (left <= 0) { clearInterval(tick); timeUp = true; finish(); }
}

function pick(i) { answers[idx] = i; render(); }
function go(i) { idx = i; render(); }
function next() { if (idx < paper.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }

function render() {
  var q = paper[idx];
  var html =
    '<div class="hall"><span class="t">STUDYOS BRAIN CHECK</span><span class="q">Round ' + (idx + 1) + ' / ' + paper.length + '</span><span class="timer" id="tm">⏱ ' + fmt(deadline - Date.now()) + '</span></div>' +
    '<div class="card">' +
      '<div><span class="subj-tag">' + esc(q.s) + '</span></div>' +
      '<p class="qtitle">' + esc(q.q) + '</p>' +
      q.o.map(function (o, i) {
        return '<button class="opt' + (answers[idx] === i ? ' on' : '') + '" onclick="pick(' + i + ')"><span class="L">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join('') +
      '<div class="row">' +
        '<button class="btn btn-g" onclick="prev()"' + (idx === 0 ? ' disabled' : '') + '>← Back</button>' +
        (idx === paper.length - 1
          ? '<button class="btn btn-p" onclick="confirmFinish()">Submit ✓</button>'
          : '<button class="btn btn-d" onclick="next()">Next →</button>') +
      '</div>' +
      '<div class="nav-row">' + paper.map(function (_, i) {
        var cls = i === idx ? ' cur' : answers[i] !== undefined ? ' ans' : '';
        return '<button class="dot' + cls + '" onclick="go(' + i + ')">' + (i + 1) + '</button>';
      }).join('') + '</div>' +
    '</div>' +
    '<p class="share-tip">Timer runs automatically — the paper submits itself at 00:00, just like the real CBT. Scored well? Flex it on WhatsApp 😉</p>';
  $('app').innerHTML = html;
}

function confirmFinish() {
  var n = Object.keys(answers).length;
  if (n < paper.length && !confirm('You answered ' + n + ' of ' + paper.length + '. Unanswered questions score zero. Submit now?')) return;
  finish();
}

function finish() {
  clearInterval(tick); done = true;
  var correct = 0, wrong = 0, blank = 0;
  var by = {};
  paper.forEach(function (q, i) {
    by[q.s] = by[q.s] || { c: 0, t: 0 };
    by[q.s].t++;
    var a = answers[i];
    if (a === undefined) blank++;
    else if (a === q.c) { correct++; by[q.s].c++; }
    else wrong++;
  });
  var pct = Math.round((correct / paper.length) * 100);
  var subs = Object.keys(by).map(function (s) { return { s: s, c: by[s].c, t: by[s].t, p: Math.round((by[s].c / by[s].t) * 100) }; }).sort(function (a, b) { return b.p - a.p; });
  var strong = subs[0], weak = subs[subs.length - 1];
  var secs = Math.round((Date.now() - startedAt) / 1000);
  lastStats = { pct: pct, correct: correct, wrong: wrong, blank: blank, strong: strong.s, weak: weak.s };
  if (pct >= 80) burstScreen();
  var verdict = pct >= 80 ? '🏆 Exam-ready! Sharp work.' : pct >= 60 ? '🎉 Solid — a little polishing and you are set.' : pct >= 40 ? '💪 Good start — your weak spots are now visible.' : '📈 Everyone starts somewhere. This is your baseline.';

  var mistakes = paper.map(function (q, i) { return { q: q, a: answers[i], i: i }; }).filter(function (m) { return m.a !== m.q.c; });

  var html =
    (timeUp ? '<div class="banner">⏰ Time&apos;s up! Your paper was submitted automatically.</div>' : '') +
    '<div class="card" style="text-align:center">' +
      '<div style="font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--ind)">🎯 YOUR BRAIN SCORE</div>' +
      '<div class="big" style="color:' + (pct >= 60 ? 'var(--grn)' : 'var(--amb)') + '">' + pct + '%</div>' +
      '<p style="font-size:13px;font-weight:700;color:#334155">' + verdict + '</p>' +
      '<div class="kpis">' +
        '<div class="kpi"><b style="color:var(--grn)">' + correct + '</b><span>correct</span></div>' +
        '<div class="kpi"><b style="color:var(--rose)">' + wrong + '</b><span>wrong</span></div>' +
        '<div class="kpi"><b style="color:#64748b">' + blank + '</b><span>blank</span></div>' +
        '<div class="kpi"><b style="color:var(--ind)">' + fmt(secs * 1000) + '</b><span>time used</span></div>' +
      '</div>' +
      '<div class="bar"><i style="width:' + pct + '%;background:' + (pct >= 60 ? 'var(--grn)' : 'var(--amb)') + '"></i></div>' +
      '<div style="display:grid;gap:9px;margin-top:16px">' +
        '<button class="btn btn-wa" style="width:100%" onclick="shareWhatsApp()">📲 Share my score on WhatsApp</button>' +
        '<a class="btn btn-p" style="width:100%" href="/">📚 Open StudyOS — sign in, it&apos;s free</a>' +
        '<button class="btn btn-g" style="width:100%" onclick="startExam()">↻ Try another paper</button>' +
      '</div>' +
    '</div>' +
    '<div class="card" style="margin-top:12px">' +
      '<b style="font-size:14px">📊 Subject breakdown</b>' +
      '<div style="margin-top:12px">' + subs.map(function (x) {
        return '<div class="srow"><div class="lbl"><span>' + esc(x.s) + '</span><span style="color:' + (x.p >= 60 ? 'var(--grn)' : 'var(--amb)') + '">' + x.p + '% (' + x.c + '/' + x.t + ')</span></div><div class="bar"><i style="width:' + x.p + '%;background:' + (x.p >= 60 ? 'var(--grn)' : 'var(--amb)') + '"></i></div></div>';
      }).join('') + '</div>' +
      '<p style="font-size:12.5px;line-height:1.6;color:#334155;margin-top:6px">🧠 <b>StudyOS analysis:</b> ' + (weak.p === 100
        ? 'flawless across every subject — nothing to fix! 💯'
        : strong.p === weak.p
          ? 'even scores across the board — keep every subject warm 🔥'
          : 'your strongest area is <b>' + esc(strong.s) + '</b> (' + strong.p + '%). Needs attention: <b>' + esc(weak.s) + '</b> (' + weak.p + '%).') + '</p>' +
    '</div>' +
    '<div class="card" style="margin-top:12px">' +
      (mistakes.length
        ? '<b style="font-size:14px">📖 Worked explanations (' + mistakes.length + ' question' + (mistakes.length === 1 ? '' : 's') + ' to review)</b>'
        : '<b style="font-size:14px">🏆 Perfect paper — nothing to review!</b>') +
      '<div class="lockwrap" style="margin-top:12px">' +
        '<div class="locked">' + (mistakes.length ? mistakes : [{ q: { q: 'Every explanation unlocked inside the app', o: ['', '', '', ''], c: 0 }, a: undefined }]).map(function (m) {
          var q = m.q;
          return '<div class="exp"><p class="qq">' + esc(q.q) + '</p><p class="aa">✅ Correct: ' + esc(q.o[q.c]) + '</p><p class="ee">' + esc(q.e || '') + '</p></div>';
        }).join('') + '</div>' +
        '<div class="lockveil">' +
          '<div style="font-size:26px">🔒</div>' +
          '<b style="font-size:14px">Every answer explained, step by step</b>' +
          '<p style="font-size:12px;color:#475569;max-width:340px">Plus a personal study plan that drills your weak topics daily — free inside StudyOS.</p>' +
          '<a class="btn btn-p" href="/">📚 Unlock everything in StudyOS — free →</a>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<p class="foot">StudyOS — 83 topics · 1,000+ questions · full CBT exam hall.<br><a href="/">Open the full app</a> · Free forever during launch 🚀</p>';
  $('app').innerHTML = html;
  window.scrollTo({ top: 0 });
}

function burstScreen() {
  var layer = document.createElement('div');
  layer.className = 'pconfetti';
  var colors = ['#22c55e', '#4ade80', '#facc15', '#f472b6', '#38bdf8', '#a78bfa', '#fb923c', '#4f46e5'];
  var W = window.innerWidth || 360, H = window.innerHeight || 640;
  var spread = Math.min(W, H) * 0.55;
  for (var i = 0; i < 110; i++) {
    var bit = document.createElement('i');
    var ang = Math.random() * Math.PI * 2;
    var dist = spread * (0.3 + Math.random() * 0.7);
    bit.style.background = colors[i % colors.length];
    bit.style.width = (5 + Math.random() * 5) + 'px';
    bit.style.height = (8 + Math.random() * 6) + 'px';
    bit.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
    bit.style.setProperty('--dy', (Math.sin(ang) * dist) + 'px');
    bit.style.animationDelay = (Math.random() * 0.25) + 's';
    bit.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
    layer.appendChild(bit);
  }
  document.body.appendChild(layer);
  setTimeout(function () { layer.remove(); }, 3000);
}
var lastStats = null;
function shareWhatsApp() {
  var st = lastStats; if (!st) return;
  var link = location.href.split('#')[0];
  var msg =
    '🧠 *StudyOS Brain Check*\n\n' +
    'I just scored *' + st.pct + '%* 🎉\n' +
    '✅ ' + st.correct + ' correct · ❌ ' + st.wrong + ' wrong · ➖ ' + st.blank + ' blank\n' +
    '💪 Strongest: ' + st.strong + '\n' +
    '🎯 To improve: ' + st.weak + '\n\n' +
    '10 easy questions · 10 minutes · totally free.\n' +
    'Think you can beat my score? 😏👇\n' + link;
  location.href = 'https://wa.me/?text=' + encodeURIComponent(msg);
}

landing();
</script>
</body>
</html>
